<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Combustible</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="misEstilos.css">
    <script src="misScripts.js" defer></script>
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="badge">Autonomía & Viaje</div>
            <h1>⛽ Calcular Combustible</h1>
            <p class="subtitle">Calculá cuántos litros vas a necesitar según la distancia de tu recorrido.</p>
            
            <div class="form-group">
                <label for="textoKm">Distancia en Kilómetros (km)</label>
                <input type="number" id="textoKm" value="100" min="0" inputmode="decimal" placeholder="Ej: 250">
            </div>

            <button type="button" class="btn-calc" onclick="calcularLitros();">Calcular Consumo</button>

            <div class="result-card" id="resultCard">
                <span class="result-title">Estimación de Combustible</span>
                <p id="textoResultado">Ingresá los kilómetros y presioná calcular</p>
            </div>
        </div>
    </main>
</body>
</html>
